version: '3.8'

services:
  # Database chính
  db:
    image: postgres:15-alpine
    container_name: sirius-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-sirius_chat}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Database Vector
  chromadb:
    image: chromadb/chroma
    container_name: sirius-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data

  # Back-end NestJS
  api:
    build: .
    container_name: sirius-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - chromadb

volumes:
  postgres_data:
  chroma_data:
